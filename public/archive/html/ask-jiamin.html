<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Jiamin</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg" href="../orange.svg">
    <!-- <link rel="stylesheet" href="../css/styles.css"> -->
    <link href="../css/ask-jiamin.css" rel="stylesheet">
</head>
<body>

    <!-- Boba Count Button -->
    <button id="bobaCountButton" class="btn btn-primary">Boba/Coffee Count ヾ( ･`⌓´･)ﾉﾞ: 0</button>

    <!-- Question Text Box-->
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card text-center">
            <div class="card-header">
                <button id="exitButton" class="exit-button">✕</button>
                <h5 class="card-title">Hardest Test Ever</h5>
            </div>
            <div class="card-body">
                <p class="card-text">Welcome! Would you like to ask a question?</p>
                <div class="btn-container">
                    <button id="yesButton" class="btn">はい</button>
                    <button id="noButton" class="btn">いいえ</button>
                </div>
                <button id="nextButton" class="btn btn-success btn-next" style="display: none; margin-top: 20px;">Next</button>
            </div>
        </div>
        <button id="refreshButton" class="btn btn-info" style="display:none;">いってらっしゃい</button>
    </div>

    <!-- Click Me Button -->
    <button id="clickMeButton" class="btn btn-info">Click Me ヾ(＾-＾)ノ</button>

    <!-- Credits Button -->
    <button id="creditsButton" class="btn btn-info">To: Jiamin Cheng<br>From: Christopher Bui</br></button>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="../js/ask-jiamin.js"></script>
</body>
</html>
